              - 1. Prepare Proxmox: guides/proxmox/prepare-proxmox.md
              - 2. Connect the server: guides/proxmox/connect-the-server.md
              - 3. Install operating systems: guides/proxmox/operating-systems.md
              - 4. Create the product: guides/proxmox/create-the-product.md
              - 5. The customer's panel: guides/proxmox/customer-panel.md
              - Running VPS services: guides/proxmox/running-vps.md
