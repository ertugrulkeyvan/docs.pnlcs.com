site_name: PNLCS Docs
site_description: Install, run and extend PNLCS, the open-source hosting billing platform and client portal
site_url: https://docs.pnlcs.com/
repo_url: https://github.com/Panelica/pnlcs
repo_name: Panelica/pnlcs
edit_uri: https://github.com/ertugrulkeyvan/docs.pnlcs.com/edit/main/docs/
copyright: PNLCS is MIT licensed and maintained by Panelica and volunteers.

theme:
  name: material
  variant: modern
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.copy
    - content.action.edit
    - toc.follow
    - announce.dismiss

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/pnlcs.css

extra_javascript:
  - assets/pnlcs.js

extra:
  site_home: https://pnlcs.com/
  demo: https://hosting.panelica.com/
  docs_repo: https://github.com/ertugrulkeyvan/docs.pnlcs.com

plugins:
  - search
  - llmstxt:
      markdown_description: Documentation for PNLCS, a free, MIT-licensed, self-hosted hosting billing platform and client portal (an open-source WHMCS alternative).
      full_output: llms-full.txt
      sections:
        Installation:
          - install/*.md
        Getting started:
          - getting-started/*.md
        Concepts:
          - concepts/*.md
        Guides:
          - guides/*.md
          - guides/proxmox/*.md
          - modules/*.md
        API:
          - api/*.md
        MCP server:
          - mcp/*.md
        Developer:
          - developer/*.md
        Help:
          - troubleshooting/*.md
          - reference/*.md

nav:
  - Home: index.md
  - Install:
      - install/index.md
      - Requirements: install/requirements.md
      - Docker: install/docker.md
      - On your own server: install/native.md
      - Inside a hosting panel: install/hosting-panel.md
      - Deploy on Plesk: guides/deploy-plesk.md
      - Keep it running:
          - Updating: install/updating.md
          - Backups: install/backups.md
          - Security checklist: install/security.md
  - Learn:
      - Getting started:
          - First login: getting-started/first-login.md
