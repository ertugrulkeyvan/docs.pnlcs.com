          - Live servers: guides/live-servers.md
          - Modules: guides/modules.md
          - Sell domains: guides/sell-domains.md
          - Sell Docker apps: guides/sell-docker-apps.md
          - Sell Panelica licenses: guides/sell-panelica-licenses.md
          - Sell VPS on Proxmox VE:
